<!DOCTYPE html>
<html lang="en">
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Token QR Code</title>
    <link rel="stylesheet" href="assets/vendors/core/core.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/fonts/feather-font/css/iconfont.css">
    <link rel="stylesheet" href="assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css">
    <link rel="stylesheet" href="assets/vendors/toastr/toastr.min.css">
    <link rel="icon" href="assets/img/logo.png" type="image/png" />
    <style>
        .captcha-wrap {
            container-type: inline-size;
            display: flex;
            justify-content: center;
        }

        .captcha-wrap h-captcha {
            transform-origin: center;
        }

        @container (max-width: 302px) {
            .captcha-wrap h-captcha { transform: scale(0.9); }
        }

        @container (max-width: 271px) {
            .captcha-wrap h-captcha { transform: scale(0.85); }
        }

        @container (max-width: 256px) {
            .captcha-wrap h-captcha { transform: scale(0.8); }
        }

        @container (max-width: 241px) {
            .captcha-wrap h-captcha { transform: scale(0.75); }
        }

        @container (max-width: 226px) {
            .captcha-wrap h-captcha { transform: scale(0.7); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>

<body>
    <div class="main-wrapper">
        <div class="page-wrapper w-100 ml-0">
            <div class="page-content w-100">
                <div class="d-flex justify-content-between align-items-center flex-wrap grid-margin text-center">
                    <h4 class="mb-3 mb-md-0 text-center">QR Code Scanner</h4>
                </div>
                <div class="row d-flex justify-content-center mb-4"> <!-- <div class="row d-md-block"> -->
                    <div class="col-sm-12 col-lg-3 grid-margin">
                        <div class="card">
                            <div class="card-header align-middle text-center">
                                <i class="mb-1 text-primary mr-2 icon-small" data-feather="key"></i>
                                Discord Token via QR Code
                            </div>
                            <div class="card-body" style="padding-bottom: 0.9rem; padding-top: 1rem">
                                <div class="row align-items-center justify-content-center text-center" style="min-height: 129px">
                                    <div id='loading-div' class="col-12 col-md-5">
                                        <div class="row align-items-center h-100 w-100 text-center">
                                            <div class="col-12">
                                                <span class="text-muted">Loading...</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div id='qr-code-div' class="col-12 col-md-5 text-center" style="display: none;">
                                        <img id='qr-code' style="border-radius: 6%; width: 100%; max-width: 133px; height: auto;">
                                    </div>
                                    <div id='avatar-div' class="col-12 col-md-5 text-center" style="display: none;">
                                        <svg width="60" height="60" viewBox="0 0 60 60">
                                            <foreignObject x="0" y="0" width="60" height="60">
                                                <img id='avatar-image' class="rounded-circle" height="60px" src="https://cdn.discordapp.com/avatars/1056705933289468006/25fec3f3fe8238bd8d1d4e5659be0d6f.webp?size=128">
                                            </foreignObject>
                                            <foreignObject x="44" y="36" width="16" height="24">
                                                <img height="24px" width="16px" id='mobile-icon' src="assets/img/mobile.png">
                                            </foreignObject>
                                        </svg>
                                        <br style='display: block; content: ""; margin-top: 5px;'>
                                        <span id="phone-prompt">Check your phone!</span>
                                        <br style='display: block; content: ""; margin-top: 2px;'>
                                        <div style="line-height: 1.1em">
                                            <span class="text-muted" style="font-size: 12px">Logg<span id="logging-in">ing</span> in as <span id="discord-tag">chasa</span></span>
                                        </div>
                                        
                                    </div>
                                    <div class="col-12 col-md-7 text-center" id="scan-info">
                                        <br style='display: block; content: ""; margin-top: 15px;'>
                                        <span>Scan the QR code in the Discord
                                        <br style='display: block; content: ""; margin-top: 0px;'>
                                        App on your Phone.
                                        <br style='display: block; content: ""; margin-top: 5px;'>
                                        It will be entered into the input field for you.</span>
                                    </div>
                                    <div class="col-12 text-center" id="captcha-div" style="display: none;">
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="footer d-flex flex-column flex-md-row align-items-center justify-content-center gap-3">
                <p class="text-muted text-center mb-0">Made with ❤️ by <a href="https://github.com/itschasa" target="_blank" class="text-primary">chasa</a></p>
                <span class="text-muted mx-2" style="opacity:0.4"> | </span>
                <p class="text-muted text-center mb-0"><a href="https://example.com" target="_blank" class="text-primary">Open source</a></p>
                <span class="text-muted mx-2" style="opacity:0.4"> | </span>
                <p class="text-muted text-center mb-0"> Remade with ❤️ by <a href="https://clouds.bio/n" target="_blank" class="text-primary">nxyy</a></p>
            </footer>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.4/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-hcaptcha"></script>
    <script src="assets/vendors/core/core.js"></script>
    <script src="assets/vendors/feather-icons/feather.min.js"></script>
    <script src="assets/js/templatef195.js?v=2.1"></script>
    <script src="assets/vendors/toastr/toastr.min.js"></script>
    <script src="assets/js/qr.js"></script>
</body>

</html>
